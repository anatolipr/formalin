<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FL</title>
  </head>
  <body>
    <div id="app"></div>

    <script type="module" src="/src/main2.ts"></script>

    <script type="module">

      import { doParentFetch } from 'https://ui.impact.com/onboarding-ui/misc/fetch-utils.js'  

      doParentFetch(`/secure/nositemesh/checklist/getCheckboxMeta.json?checkBoxId={currentCheckId}`)
          .then((data) => {
            formFromJson(data);

            window.formId = JSON.parse(data).id;

            const fields = [];

            JSON.parse(data).sections.forEach(section => {

              if (section.condition && section.condition.fieldName && fields.indexOf(section.condition.fieldName) === -1) {
                fields.push(`${section.condition.fieldName}`)
              }

              section.fields.forEach(field => {
                if (field.condition && field.condition.fieldName && fields.indexOf(field.condition.fieldName) === -1) {
                  fields.push(`${field.condition.fieldName}`)
                }

                if (field.fieldName && fields.indexOf(field.fieldName) === -1) {
                  fields.push(`${formId}.${field.fieldName}`)
                }
              })

            });

            console.log('fields from metadata', fields)
            
            doParentFetch(`/secure/checklist/eventValues.json?id={instanceEid}&keys=${fields.join(',')}`)
            
            .then(data => {
              
              const parsed = JSON.parse(data);
              
              console.log('dataFromRules', parsed);

              const backup = localStorage.getItem('formalin-backup-' + formId);

              const dataForUi = {}
              Object.keys(parsed).forEach(key => {
                if (!key.startsWith(`${formId}.`) || 
                  (backup && (parsed[key] === null || parsed[key] === undefined))) {
                  return;
                }
                // remove formData prefix
                const keyWithoutPrefix = key.replace(`${formId}.`, '')
                dataForUi[keyWithoutPrefix] = parsed[key] || ''
              })

              if (Object.keys(dataForUi).length === 0) {
                
                if (backup) {
                  const parsedBackup = JSON.parse(backup);

                    Object.keys(parsedBackup.formData).forEach(key => {
                      dataForUi[key] = parsedBackup.formData[key]
                    });
                  
                }
              }

              console.log('dataForUi', dataForUi )

              ___formData.set({...dataForUi});
            })

          
          });

          window.save = function() {

            // const valid = document.forms[0].reportValidity();

            // if (!valid) {
            //   return;
            // }
            console.log('saving')
            const b = ___formData.get()
            
            //update all keys to be prefixed with formData

            const formDataForBackend = Object.keys(b).reduce((acc, key) => {
              acc[`${formId}.${key}`] = b[key]
              return acc
            }, {})
            console.log('rule form Data', formDataForBackend)

            window.parent.postMessage({
              method: 'bulkRuleUpdate',
              b: formDataForBackend
            }, '*')

            
            let errorResponse = false;

            window.addEventListener('message', (e) => {
              if (e.data.method === 'bulkRuleUpdateResponse' && !errorResponse) {
                if (e.data.text !== 'ok') {
                  errorResponse = true;
                  alert('There was an error saving the data. It looks like you need to refresh the page and try again.');
                  const backup = JSON.stringify({
                    formData: b
                  });
                  localStorage.setItem('formalin-backup-' + formId, backup);
                } else {
                  localStorage.removeItem('formalin-backup-' + formId);
                  errorResponse = false;

                  window.parent.postMessage('MARK_AS_COMPLETE_AND_GO_TO_NEXT_CHECK', '*');
                  
                }
              }
            });
            
            
          }

          document.addEventListener(
            'formalinSubmit', (e) => {
              if (e.detail && e.detail.action === 'submit') {
                save()
              }
            }
          )
    </script>

    <style>
      #app {
        padding: 20px;
      }
      button {
        background-color: rgb(114, 166, 250);
        color: white;
        margin: 20px;
      }
    </style>
  </body>
</html>
