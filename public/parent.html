<script>

function postToFrames(data) {
    const frames = document.querySelectorAll('iframe')
    frames.forEach(frame => {
        frame.contentWindow.postMessage(data, '*')
    })
}

    window.addEventListener('message', (e) => {
            
        
            if (e.data &&
                e.data.method === 'doFetch'
            ) {
                if (! e.data.channel) {
                    console.error('fetchStart with no channel')
                    return;
                } else if (!e.data.url) {
                    console.error('fetchStart with no URL')
                    return;
                }
                
                let text = 'err'
                if (atob(e.data.url) === '/secure/nositemesh/checklist/getCheckboxMeta.json?checkBoxId={currentCheckId}') {
                    text = '{"id":"formData1","sections":[{"description":"","title":"New section","fields":[{"label":"New field","description":"","type":"text","placeholder":"","fieldName":"xxx","required":true,"value":"","validation":""}]}],"buttons":[{"type":"submit","label":"Submit","enabled":true,"value":"submit"}]}';
                } else if (atob(e.data.url) === '/secure/checklist/eventValues.json?id={instanceEid}&keys=formData1.xxx') {
                    text = '{"formData1.xxx":"yyy"}';
                }


                postToFrames({
                        method: e.data.method + "Response",
                        text,
                        channel: e.data.channel
                    })


            }

    })
</script>

 style="width: 100%; height: 100%; outline: none; border: none;">
