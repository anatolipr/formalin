<script>

function postToFrames(data) {
    const frames = document.querySelectorAll('iframe')
    frames.forEach(frame => {
        frame.contentWindow.postMessage(data, '*')
    })
}

    window.addEventListener('message', (e) => {
            
        
            if (e.data &&
                e.data.method === 'doFetch'
            ) {
                if (! e.data.channel) {
                    console.error('fetchStart with no channel')
                    return;
                } else if (!e.data.url) {
                    console.error('fetchStart with no URL')
                    return;
                }
                
                let text = 'err'
                console.log('e.data.url', e.data.url)
                if (atob(e.data.url) === '/secure/nositemesh/checklist/getCheckboxMeta.json?checkBoxId={currentCheckId}') {
                    text = JSON.stringify({
                        "id": "formData1",
                        "sections": [
                            {
                            "description": "",
                            "title": "Address",
                            "fields": [
                                {
                                "label": "City",
                                "description": "",
                                "type": "text",
                                "placeholder": "",
                                "fieldName": "city",
                                "required": false,
                                "value": "Notown",
                                "validation": "[a-zA-Z]*",
                                "condition": {
                                        "fieldName": "foo",
                                        "requiredValue": "bar"
                                    }
                                },
                                {
                                "label": "Street Address",
                                "description": "",
                                "type": "text",
                                "placeholder": "",
                                "fieldName": "address",
                                "required": false,
                                "value": "",
                                "validation": ""
                                }
                            ]
                            }
                        ],
                        "buttons": [
                            {
                            "type": "submit",
                            "label": "Submit",
                            "enabled": true,
                            "value": "submit"
                            }
                        ]
                        })
                    
                } else if (atob(e.data.url) === '/secure/checklist/eventValues.json?id={instanceEid}&keys=foo,formData1.city,formData1.address') {
                    text = '{"formData1.address":"yyy", "foo": "bar"}';
                    console.log('text', text)
                }


                postToFrames({
                        method: e.data.method + "Response",
                        text,
                        channel: e.data.channel
                    })


            }

    })
</script>
