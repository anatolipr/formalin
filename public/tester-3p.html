        <script type="module">
            import { mount, form, formData, getFormDataAsNestedJson } from "./3party.js"

            mount('#viewModelForm');


            window['formalinGetFormSchemaJsonAsString'] = function() {
                console.log("formalinGetFormSchemaJsonAsString -> formalinGetCurrentChannel() -> ", formalinGetCurrentChannel());
                const data = document.getElementById('formSchema').value;
                console.log('data', data)
                return document.getElementById('formSchema').value;
            };

            window['formalinSetFormSchemaJsonAsString'] = function(data) {
                console.log("formalinSetFormSchemaJsonAsString -> formalinGetCurrentChannel() -> ", formalinGetCurrentChannel());
                document.getElementById('formSchema').value =
                    (typeof data === 'string') ? data : JSON.stringify(data);

                form.set(data);
            };


            form.set(JSON.parse(window['formalinGetFormSchemaJsonAsString']() || '{}'))

            document.getElementById('openFormModelEditorButton').onclick = function() {
                formalinOpen('test-3p');
            };

            import { createApp } from 'https://js-cdn.impact.com/npm/vue@3.4.0/dist/vue.esm-browser.js';

            const templateEl = document.getElementById('template');
            const viewModelEl = document.getElementById('viewModel');
            const shadowRoot = document.querySelector("#preview").attachShadow({mode: 'open'});



            function render() {

                const app = createApp({
                    template: templateEl.value,
                    data: () => ({
                        ... JSON.parse(viewModel.value || '{}')
                    })
                });

                shadowRoot.innerHTML = '<div></div>';
                const styleMatch = template.value.match(/<style>([\s\S]*?)<\/style>/);
                  if (styleMatch) {
                    const styleContent = styleMatch[1];

                    // Inject new style into the document head
                    const styleElement = document.createElement("style");
                    styleElement.innerText = styleContent;
                    shadowRoot.appendChild(styleElement);
                  }


                app.mount(shadowRoot.querySelector('div'));
            }

            templateEl.addEventListener('input', () => render());
            viewModelEl.addEventListener('input', () => {
                formData.set(JSON.parse(viewModelEl.value));
            });

            render();


            formData.subscribe((nv) => {
                viewModelEl.value = JSON.stringify(getFormDataAsNestedJson())
                render();
            });


            const advancedSectionEl = document.getElementById("advancedSection");
            const advancedMinimizeEl = document.getElementById("advancedMinimize");


            function toggleAdvanced() {
                if (advancedMinimizeEl.classList.contains('arrow-down')) {
                    advancedSectionEl.style.height = '0px';
                } else {
                    advancedSectionEl.style.height = advancedSectionEl.children[0].getBoundingClientRect().height + 'px';
                }
            }

            //init
            advancedMinimizeEl.addEventListener('click', () => {
                advancedMinimizeEl.classList.toggle('arrow-down');
                toggleAdvanced();
            });
        </script>
