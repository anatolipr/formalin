<!DOCTYPE html>
<html>
<head>
    <title>Opener</title>
    <script type="module" crossorigin src="https://formalin.netlify.app/mainEdit.js"></script>
    <link rel="stylesheet" crossorigin href="https://formalin.netlify.app/assets/mainEdit.css"></script>
</head>

<body style="margin: 0; padding: 0;">

    <textarea id="formData">{
        "id": "formData",
        "sections": [
          {
            "description": "",
            "title": "Main section",
            "fields": [
              {
                "label": "Full name",
                "description": "",
                "type": "text",
                "placeholder": "eg John Smith",
                "fieldName": "",
                "required": false,
                "value": "",
                "validation": ""
              }
            ]
          }
        ],
        "buttons": [
          {
            "type": "submit",
            "label": "Submit",
            "enabled": true,
            "value": "submit"
          }
        ]
      }</textarea>

      <script>

        globalThis[Symbol.for('formalinGetFormSchemaJsonAsString')] = function() {
            return document.getElementById('formData').value;
        };

        globalThis[Symbol.for('formalinSetFormSchemaJsonAsString')] = function(data) {
            console.log("formalinSetFormSchemaJsonAsString -> getFormalinCurrentChannel() -> ", getFormalinCurrentChannel());  
            document.getElementById('formData').value = 
                (typeof data === 'string') ? data : JSON.stringify(data);
        };

        
      </script>

    

</body>


</html>
